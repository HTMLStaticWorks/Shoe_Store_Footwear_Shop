<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLE | Register Profile</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c5a880' stroke-width='1.5'%3E%3Cpath d='M12 2c0 5.523 4.477 10 10 10-5.523 0-10 4.477-10 10 0-5.523-4.477-10-10-10 5.523 0 10-4.477 10-10z' fill='%23c5a880' fill-opacity='0.1'/%3E%3Cpath d='M12 8l4 4-4 4-4-4 4-4z' fill='%23c5a880'/%3E%3C/svg%3E">
  <meta name="description" content="Register your private SOLE profile to receive bespoke shoe suggestions and style counseling details.">
  
  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fbf8f3',
              100: '#f5edd9',
              200: '#ebdcb3',
              300: '#dec283',
              400: '#cfa252',
              500: '#c5a880',
              600: '#b08432',
              700: '#946626',
              800: '#7a511f',
              900: '#64411a',
            },
            charcoal: {
              50: '#f4f4f5',
              100: '#e4e4e7',
              800: '#1b1b1f',
              900: '#111115',
              950: '#0a0a0c',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cinzel"', 'serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Main Style Sheet -->
  <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body class="bg-charcoal-50 dark:bg-charcoal-950 text-charcoal-900 dark:text-zinc-100 transition-colors duration-300 min-h-screen flex items-center justify-center font-sans p-4 relative">

  <!-- RTL & Theme Toggle controls (Absolute top-right corner) -->
  <div class="absolute top-6 right-6 flex items-center space-x-4 rtl:space-x-reverse z-10">
    <button class="rtl-toggle-btn w-10 h-10 rounded-full flex items-center justify-center border border-gold-500/30 hover:bg-gold-500/10 text-gold-500 font-bold text-xs transition-all duration-300 bg-white/80 dark:bg-charcoal-900/80 backdrop-blur-sm shadow-md shrink-0">
      <span class="rtl-btn-text">RTL</span>
    </button>
    <button class="theme-toggle-btn w-10 h-10 rounded-full flex items-center justify-center border border-gray-200 dark:border-white/10 text-charcoal-900 dark:text-gray-300 hover:text-gold-500 dark:hover:text-gold-500 transition-all duration-300 bg-white/80 dark:bg-charcoal-900/80 backdrop-blur-sm shadow-md shrink-0">
      <span class="theme-icon"></span>
    </button>
  </div>

  <!-- Centered Signup Card -->
  <div class="w-full max-w-md bg-white dark:bg-charcoal-900 border border-gray-100 dark:border-white/5 rounded-3xl p-8 sm:p-10 shadow-2xl animate-fade-in-up space-y-6">
    
    <!-- Logo and Title Header (Centered) -->
    <div class="text-center flex flex-col items-center justify-center space-y-2">
      <a href="index.html" class="flex items-center justify-center space-x-2.5 rtl:space-x-reverse mb-2">
        <svg class="w-8 h-8 text-gold-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c0 5.523 4.477 10 10 10-5.523 0-10 4.477-10 10 0-5.523-4.477-10-10-10 5.523 0 10-4.477 10-10z" fill="currentColor" fill-opacity="0.1" />
          <path d="M12 8l4 4-4 4-4-4 4-4z" fill="currentColor" />
        </svg>
        <span class="text-2xl font-bold tracking-widest text-gold-500 luxury-text">
          SOLE.
        </span>
      </a>
      <h2 class="text-3xl font-extrabold text-charcoal-900 dark:text-white">Create Profile</h2>
      <p class="text-xs text-gray-500 dark:text-gray-400">Join the SOLE Circle to catalog bespoke sizing.</p>
    </div>

    <!-- Form -->
    <form id="signup-form" class="space-y-4 text-sm">
      <!-- First Name -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">First Name *</label>
        <input type="text" id="first-name" required placeholder="Marcus" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/10 bg-transparent focus:outline-none focus:border-gold-500">
      </div>

      <!-- Last Name -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Last Name *</label>
        <input type="text" id="last-name" required placeholder="Sterling" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/10 bg-transparent focus:outline-none focus:border-gold-500">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Email Address *</label>
        <input type="email" required placeholder="name@business.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/10 bg-transparent focus:outline-none focus:border-gold-500">
      </div>

      <!-- Phone Number -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Phone Number *</label>
        <input type="tel" required placeholder="+1 (555) 000-0000" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/10 bg-transparent focus:outline-none focus:border-gold-500">
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Password *</label>
        <input type="password" required placeholder="Minimum 8 characters" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/10 bg-transparent focus:outline-none focus:border-gold-500">
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Confirm Password *</label>
        <input type="password" id="confirm-password" required placeholder="Confirm your password" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/10 bg-transparent focus:outline-none focus:border-gold-500">
      </div>

      <!-- Accept Terms -->
      <div class="flex items-start mb-2">
        <input type="checkbox" required id="accept-terms" class="rounded text-gold-500 focus:ring-gold-500 w-4 h-4 bg-transparent border-gray-300 dark:border-white/10 mt-0.5">
        <label for="accept-terms" class="ml-2 text-xs text-gray-500 dark:text-gray-400 font-semibold cursor-pointer leading-relaxed">
          I accept the <a href="#" class="text-gold-500 hover:text-gold-600 font-bold">Terms of Service</a> and <a href="#" class="text-gold-500 hover:text-gold-600 font-bold">Privacy Policy</a>.
        </label>
      </div>

      <!-- Main Create Profile Button -->
      <button type="submit" class="w-full py-4 bg-gold-500 hover:bg-gold-600 text-charcoal-950 font-bold rounded-xl transition-all shadow-md">Create Profile</button>

      <!-- Separator (Moved below form submit) -->
      <div class="flex items-center justify-between text-xs text-gray-400 dark:text-gray-500 py-1">
        <div class="h-px bg-gray-100 dark:bg-white/10 w-full"></div>
        <span class="px-3 whitespace-nowrap">or register with</span>
        <div class="h-px bg-gray-100 dark:bg-white/10 w-full"></div>
      </div>

      <!-- Social Logins (Moved below separator) -->
      <div class="grid grid-cols-2 gap-4">
        <button type="button" class="flex items-center justify-center gap-2 py-3 border border-gray-200 dark:border-white/10 hover:border-gold-500 rounded-xl text-xs font-semibold bg-transparent transition-all">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09zM12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23zM5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22-.19-.63zM12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="flex items-center justify-center gap-2 py-3 border border-gray-200 dark:border-white/10 hover:border-gold-500 rounded-xl text-xs font-semibold bg-transparent transition-all">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.51-.64.73-1.2 1.87-1.05 2.99 1.12.09 2.27-.56 3-1.44Z"/></svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Link to Login -->
      <p class="text-xs text-gray-500 dark:text-gray-400 text-center font-medium pt-2">
        Already have an account? <a href="login.html" class="text-gold-500 hover:text-gold-600 font-bold">Sign In</a>
      </p>
    </form>

  </div>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  <!-- Global App Script -->
  <script src="app.js"></script>
</body>
</html>
